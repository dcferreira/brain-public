# Machines that run brain workers, one row each. Whitespace-separated columns:
#   name             the host's name everywhere (worker notes' `host:`, --host flags)
#   ssh_alias        how other machines reach it (`ssh <alias>`); `-` = no ssh route
#                    to this host (it can only be used from itself)
#   harnesses        comma-separated harnesses it may run
#   default_harness  harness used when none is asked for
#   hostnames        comma-separated machine hostnames (case-insensitive, a trailing
#                    `.local` ignored) by which a machine finds its own row
# A machine finds its own row via $BRAIN_SELF_HOST if set, else by its hostname
# (`hostname -s` / `hostname`) against the hostnames column. `local` is no longer a
# row; it is only a deprecated alias for "this machine" (see lib/host.sh).
# name         ssh_alias       harnesses    default_harness   hostnames
desktop   desktop    omp,claude   omp               desktop-pc
homeserver          homeserver           claude       claude            homeserver
laptop        laptop         claude       claude            laptop,My-Air,My-MacBook-Air
